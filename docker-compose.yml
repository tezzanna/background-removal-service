services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - u2net-cache:/app/.u2net
    environment:
      - BG_REMOVAL_MODEL=isnet-general-use

  frontend:
    build: ./frontend
    ports:
      - "8501:8501"
    environment:
      - API_URL=http://backend:8000
    depends_on:
      - backend

volumes:
  u2net-cache:
